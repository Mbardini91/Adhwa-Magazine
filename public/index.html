<style>
:root{
  --navy:#0b1630; --navy2:#13244a; --ink:#e9eef8; --mute:#93a3c4;
  --blue:#5fb4f0; --glass:rgba(255,255,255,.06); --line:rgba(255,255,255,.10);
  --bar:64px; --foot:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(1200px 700px at 50% 35%, rgba(95,180,240,.16), transparent 60%),
    radial-gradient(900px 600px at 85% 110%, rgba(120,90,220,.10), transparent 60%),
    linear-gradient(180deg,#0d1a38 0%,var(--navy) 100%);
  -webkit-font-smoothing:antialiased; user-select:none;
}
body::before{ /* sparkle dust, echoing the cover */
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1.2px 1.2px at 12% 22%,#fff8,transparent 60%),
    radial-gradient(1px 1px at 78% 14%,#fff6,transparent 60%),
    radial-gradient(1.4px 1.4px at 64% 78%,#fff5,transparent 60%),
    radial-gradient(1px 1px at 30% 84%,#fff6,transparent 60%),
    radial-gradient(1.2px 1.2px at 92% 56%,#fff5,transparent 60%),
    radial-gradient(1px 1px at 6% 62%,#fff5,transparent 60%);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:fixed;inset:0 0 auto 0;height:var(--bar);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:4px 4px 4px 10px;margin-right:-4px;border-radius:14px;transition:background .2s}
.brand:hover{background:rgba(255,255,255,.06)}
.brand .hm{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);transition:background .2s,border-color .2s}
.brand:hover .hm{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
.brand:active .hm{transform:scale(.94)}
.brand b{font-weight:600;font-size:22px;letter-spacing:.5px}
.brand span{font-size:12.5px;color:var(--mute);font-weight:400}
.tools{display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);background:var(--glass);border:1px solid var(--line);transition:background .2s,border-color .2s,transform .15s}
.ib:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
.ib:active{transform:scale(.94)}
.ib.on{background:var(--blue);color:#06142c;border-color:var(--blue)}

/* stage */
.stage{position:fixed;left:0;right:0;top:var(--bar);bottom:var(--foot);display:grid;place-items:center}
#bookWrap{position:relative;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
#book{position:relative}
#bookWrap::after{ /* floor shadow */
  content:"";position:absolute;left:4%;right:4%;bottom:-18px;height:30px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);filter:blur(6px);z-index:-1
}
.page{background:#fff;overflow:hidden}
.page .pi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.page .shade{position:absolute;inset:0;pointer-events:none}
.page.--left .shade{background:linear-gradient(to left,rgba(0,0,0,.14),transparent 6%)}
.page.--right .shade{background:linear-gradient(to right,rgba(0,0,0,.14),transparent 6%)}
.lk{position:absolute;display:block;border-radius:3px;z-index:3;cursor:pointer;transition:background .2s,box-shadow .2s}
.lk:hover{background:rgba(95,180,240,.14);box-shadow:inset 0 0 0 1.5px rgba(95,180,240,.75)}
body.showlinks .lk{background:rgba(95,180,240,.12);box-shadow:inset 0 0 0 1.5px rgba(95,180,240,.7)}
.hl{position:absolute;inset:0;pointer-events:none;z-index:2}
.hl i{position:absolute;background:rgba(255,213,74,.45);border-radius:2px;mix-blend-mode:multiply;animation:pulse 1.6s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,200,40,.9)}100%{box-shadow:0 0 0 12px rgba(255,200,40,0)}}

/* side arrows */
.nav{position:fixed;top:50%;transform:translateY(-50%);z-index:15;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);transition:opacity .25s,background .2s}
.nav:hover{background:rgba(255,255,255,.14)}
.nav[disabled]{opacity:.15;pointer-events:none}
.nav.fwd{left:18px}.nav.back{right:18px}

/* footer */
.foot{position:fixed;inset:auto 0 0 0;height:var(--foot);display:flex;align-items:center;justify-content:center;gap:18px;padding:0 22px;z-index:20}
.count{font-size:13px;color:var(--mute);min-width:118px;text-align:center;font-variant-numeric:tabular-nums}
.count b{color:var(--ink);font-weight:500}
input[type=range]{direction:rtl;-webkit-appearance:none;appearance:none;width:min(420px,46vw);height:3px;border-radius:3px;background:linear-gradient(to left,var(--blue) var(--p,0%),rgba(255,255,255,.15) var(--p,0%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(95,180,240,.35)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(95,180,240,.35)}
.hint{position:fixed;top:calc(var(--bar)/2 - 9px);left:50%;transform:translateX(-50%);font-size:12px;color:var(--mute);opacity:0;transition:opacity .6s;pointer-events:none;z-index:5;white-space:nowrap}
.hint.on{opacity:.9}

/* drawers */
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(400px,92vw);z-index:40;background:rgba(12,24,52,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .45s cubic-bezier(.3,.7,.2,1);display:flex;flex-direction:column;user-select:text}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px}
.dh h3{font-weight:500;font-size:16px}
.sbox{margin:0 20px 10px;position:relative}
.sbox input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:15px;padding:0 44px 0 14px;outline:none;transition:border-color .2s}
.sbox input:focus{border-color:var(--blue)}
.sbox svg{position:absolute;right:14px;top:13px;color:var(--mute)}
.smeta{padding:0 20px 8px;font-size:12px;color:var(--mute);min-height:22px}
.results{overflow:auto;padding:0 12px 24px;flex:1}
.res{display:flex;gap:12px;padding:10px;border-radius:12px;cursor:pointer;transition:background .2s;text-align:right;width:100%}
.res:hover,.res:focus-visible{background:rgba(255,255,255,.07);outline:none}
.res img{width:48px;height:68px;object-fit:cover;border-radius:4px;flex:none;background:#fff}
.res .rp{font-size:11.5px;color:var(--blue);margin-bottom:4px}
.res .rs{font-size:13px;line-height:1.75;color:#c9d4ea}
.res mark{background:rgba(255,213,74,.28);color:#fff;border-radius:3px;padding:0 2px}
.empty{padding:28px 20px;color:var(--mute);font-size:13px;line-height:1.8}

.thumbs{overflow:auto;padding:4px 16px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;flex:1}
.th{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mute)}
.th img{width:100%;aspect-ratio:595/842;object-fit:cover;border-radius:4px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s;outline:2px solid transparent;outline-offset:2px}
.th:hover img{transform:translateY(-2px)}
.th.cur img{outline-color:var(--blue)}
.th.cur{color:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(3,8,20,.45);z-index:35;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}

/* zoom */
.zoom{position:fixed;inset:0;z-index:50;background:rgba(6,12,28,.97);display:none}
.zoom.open{display:block}
.zbar{position:absolute;top:0;left:0;right:0;height:var(--bar);display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:2;background:linear-gradient(rgba(6,12,28,.95),rgba(6,12,28,0))}
.zbar .zl{display:flex;gap:6px;align-items:center}
.zbar .zv{font-size:12px;color:var(--mute);min-width:44px;text-align:center}
.zsc{position:absolute;inset:0;overflow:auto;cursor:grab}
.zsc.drag{cursor:grabbing}
.zin{display:flex;flex-direction:row;gap:0;margin:var(--bar) auto 40px;width:max-content;padding:0 40px}
.zp{position:relative;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.zp img{display:block;width:100%;height:100%;-webkit-user-drag:none}

.gameov{position:fixed;inset:0;z-index:55;background:#08111f;display:flex;flex-direction:column}
.gameov[hidden]{display:none}
.gbar{flex:0 0 auto;position:relative;z-index:2;height:calc(60px + env(safe-area-inset-top,0px));min-height:60px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(#0d1a38,#08111f);border-bottom:1px solid var(--line)}
.gbar .gt{font-size:15px;font-weight:600;letter-spacing:.3px}
.gbar .gt small{display:block;font-size:11px;font-weight:400;color:var(--mute)}
.gameov iframe{flex:1 1 auto;min-height:0;width:100%;border:0;background:#08111f;position:relative;z-index:1}
.lk[data-game]{cursor:pointer}
.loader{position:fixed;inset:0;display:grid;place-items:center;z-index:60;background:var(--navy);transition:opacity .6s}
.loader.done{opacity:0;pointer-events:none}
.loader div{font-size:30px;font-weight:600;letter-spacing:1px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}

/* ---------- footer actions ---------- */
.foot{justify-content:space-between}
.acts,.navg{display:flex;align-items:center;gap:10px}
.navg{gap:18px}
.topics{display:flex;gap:8px}
.tp{display:flex;align-items:center;gap:2px;height:40px;padding:0 4px 0 14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);animation:tpin .45s cubic-bezier(.3,.7,.2,1)}
@keyframes tpin{from{opacity:0;transform:translateY(6px)}}
.tp .tt{font-size:13px;color:#d5def0;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.like{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:16px;font-size:13px;color:var(--ink);transition:background .2s}
.like:hover{background:rgba(255,255,255,.08)}
.like svg{width:18px;height:18px;transition:transform .35s cubic-bezier(.3,1.8,.5,1),fill .2s,stroke .2s}
.like b{font-weight:500;min-width:10px;font-variant-numeric:tabular-nums}
.like.on svg{fill:#ff5470;stroke:#ff5470;transform:scale(1.12)}
.like.pop svg{animation:heart .55s cubic-bezier(.3,1.8,.5,1)}
@keyframes heart{0%{transform:scale(.6)}50%{transform:scale(1.35)}100%{transform:scale(1.12)}}
.like{position:relative}
.like i{position:absolute;right:14px;top:50%;width:5px;height:5px;border-radius:50%;background:#ff8aa0;pointer-events:none;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.ab{height:40px;min-width:40px;padding:0 11px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--glass);border:1px solid var(--line);font-size:13px;transition:background .2s,border-color .2s,transform .15s}
.ab:hover{background:rgba(255,255,255,.12)}
.ab:active{transform:scale(.95)}
.ab.cap{background:rgba(95,180,240,.16);border-color:rgba(95,180,240,.45)}
.ab.cap:hover{background:rgba(95,180,240,.26)}
.ab.on{background:var(--blue);color:#06142c;border-color:var(--blue)}

/* share sheet */
.pop{position:fixed;z-index:45;width:300px;padding:16px;border-radius:18px;background:rgba(14,28,60,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.45);opacity:0;transform:translateY(8px) scale(.98);pointer-events:none;transition:opacity .25s,transform .25s}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.popt{font-size:13px;color:var(--mute);margin-bottom:12px;line-height:1.6}
.popt b{color:var(--ink);font-weight:500;display:block;font-size:14px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sgrid button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:12px;font-size:11.5px;color:#cfd9ee;background:rgba(255,255,255,.04);transition:background .2s}
.sgrid button:hover{background:rgba(255,255,255,.1)}
.sgrid svg{width:22px;height:22px}

/* capture */
.capo{position:fixed;inset:0;z-index:30;display:none;cursor:crosshair;touch-action:none}
.capo.open{display:block}
.capbar{position:fixed;top:0;left:0;right:0;height:var(--bar);display:flex;align-items:center;justify-content:center;gap:16px;background:linear-gradient(rgba(6,12,28,.96),rgba(6,12,28,.85));font-size:14px;z-index:2;cursor:default}
.capbar .ib{position:absolute;left:22px}
.capshade{position:fixed;background:rgba(5,10,24,.55);pointer-events:none}
.capsel{position:fixed;display:none;border:1.5px solid #fff;border-radius:6px;box-shadow:0 0 0 9999px rgba(5,10,24,.6),0 0 0 4px rgba(95,180,240,.35);pointer-events:none}
.capsel::after{content:attr(data-size);position:absolute;bottom:-26px;left:0;font-size:11px;color:var(--mute);white-space:nowrap}
.capo.hover .capsel{display:block}
body.capturing .foot,body.capturing .nav,body.capturing .top{opacity:.15;pointer-events:none}

.cardm{position:fixed;inset:0;z-index:55;background:rgba(4,9,22,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;place-items:center;padding:24px}
.cardm.open{display:grid;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.cardin{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:100%;max-height:100%}
.cardimg{max-height:calc(100vh - 140px);display:flex}
.cardimg img{max-width:min(92vw,820px);max-height:calc(100vh - 140px);object-fit:contain;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:rise .45s cubic-bezier(.3,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
.cardacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.pb,.sb{height:44px;padding:0 18px;border-radius:22px;display:flex;align-items:center;gap:8px;font-size:14px;transition:background .2s,transform .15s}
.pb{background:var(--blue);color:#06142c;font-weight:500}
.pb:hover{background:#7cc4f5}
.sb{background:rgba(255,255,255,.08);border:1px solid var(--line)}
.sb:hover{background:rgba(255,255,255,.14)}
.pb:active,.sb:active{transform:scale(.96)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);background:#fff;color:#0b1630;font-size:13.5px;padding:10px 18px;border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:70}
.toast.on{opacity:1;transform:translate(-50%,0)}
body.listening .toast{bottom:calc(var(--foot) + 84px)}


/* ---------- sound toggle ---------- */
#bSound .mx{display:none}
#bSound.off .w1,#bSound.off .w2{display:none}
#bSound.off .mx{display:inline}
#bSound.off{color:var(--mute)}
a.ib{text-decoration:none}
.ab.lis{height:40px}
.ab.lis.on{background:var(--blue);color:#06142c;border-color:var(--blue)}

/* ---------- read-aloud ---------- */
.tts{position:absolute;inset:0;pointer-events:none;z-index:2}
.tts i{position:absolute;background:rgba(95,180,240,.30);border-radius:3px;mix-blend-mode:multiply;transition:opacity .25s}
body.listening .page{cursor:pointer}
.player{position:fixed;left:50%;bottom:calc(var(--foot) + 10px);transform:translate(-50%,20px);z-index:25;display:flex;align-items:center;gap:6px;padding:8px 10px 8px 8px;border-radius:30px;background:rgba(14,28,60,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.3,.7,.2,1)}
.player.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pinfo{display:flex;flex-direction:column;line-height:1.3;padding:0 8px 0 4px;min-width:150px;max-width:230px}
.pinfo b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo span{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:background .2s,transform .15s}
.pbtn:hover{background:rgba(255,255,255,.1)}
.pbtn:active{transform:scale(.92)}
.pbtn.big{width:46px;height:46px;background:var(--blue);color:#06142c}
.pbtn.big:hover{background:#7cc4f5}
.pbtn.big svg{fill:currentColor;stroke:none}
.pbtn.big .ic-pause{fill:none;stroke:currentColor;stroke-width:2.4}
.pbtn.sp{width:auto;padding:0 10px;border-radius:19px;font-size:12.5px;font-variant-numeric:tabular-nums}
.player .ic-play{display:none}
.player.paused .ic-play{display:block}.player.paused .ic-pause{display:none}
.eq{display:flex;align-items:flex-end;gap:2px;height:16px;width:20px;margin-right:6px}
.eq i{flex:1;background:var(--blue);border-radius:1px;height:30%;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
.player.paused .eq i{animation-play-state:paused;opacity:.4}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}


/* ---------- full screen (immersive) ---------- */
#bFull .fs-out{display:none}
body.immersive #bFull .fs-in{display:none}
body.immersive #bFull .fs-out{display:block}
body.ochrome .top{padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top))}
body.ochrome .foot{padding-bottom:env(safe-area-inset-bottom);height:calc(52px + env(safe-area-inset-bottom))}
body.ochrome .brand .hm{width:36px;height:36px}
.top{padding-top:env(safe-area-inset-top)}


/* =========================================================
   SIDE RAILS — landscape screens: controls stand vertically
   on both sides, the magazine gets the full height
   ========================================================= */
.sep{display:block;width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.tip{position:fixed;z-index:80;pointer-events:none;background:#fff;color:#0b1630;font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:10px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;transform:scale(.96);transition:opacity .15s,transform .15s}
.tip.on{opacity:1;transform:none}
body.rails{--rail:72px;--bar:0px;--foot:0px}
body.rails .stage{top:0;bottom:0;left:var(--rail);right:var(--rail)}
body.rails .top,body.rails .foot{top:0;bottom:0;height:auto;width:var(--rail);flex-direction:column;padding:18px 0;gap:0;
  background:linear-gradient(rgba(10,20,44,.55),rgba(10,20,44,.35));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.rails .top{left:auto;right:0;justify-content:flex-start;border-left:1px solid var(--line)}
body.rails .foot{left:0;right:auto;justify-content:space-between;border-right:1px solid var(--line)}
body.rails .brand{padding:0;margin:0 0 6px;flex-direction:column;gap:6px}
body.rails .brand b{font-size:13px;letter-spacing:0;display:block}
body.rails .brand span{display:none}
body.rails .brand:hover{background:none}
body.rails .tools{flex:1;flex-direction:column;justify-content:center;align-items:center;gap:8px}
body.rails .sep{width:22px;height:1px;margin:6px 0}
body.rails .top .ib,body.rails .ab{width:44px;height:44px;min-width:44px;padding:0;border-radius:14px}
body.rails .ab span{display:none}
body.rails .acts{flex-direction:column;gap:10px}
body.rails .topics{flex-direction:column;gap:8px}
body.rails .tp{flex-direction:column;height:auto;width:48px;padding:4px 0;border-radius:24px;gap:0}
body.rails .tp .tt{display:none}
body.rails .like{flex-direction:column;gap:3px;height:auto;padding:8px 0 6px;width:100%;border-radius:20px;font-size:12px}
body.rails .like i{right:50%;top:16px}
body.rails .navg{flex-direction:column;gap:14px}
body.rails .navg input[type=range]{display:block;direction:ltr;writing-mode:vertical-lr;width:3px;height:min(300px,34vh);
  background:linear-gradient(to bottom,var(--blue) var(--p,0%),rgba(255,255,255,.15) var(--p,0%))}
body.rails .count{min-width:0;font-size:11.5px;line-height:1.5;text-align:center}
body.rails .count b{display:block;font-size:13px}
body.rails .nav.fwd{left:calc(var(--rail) + 16px)}
body.rails .nav.back{right:calc(var(--rail) + 16px)}
body.rails .hint{top:14px}
body.rails .toast{bottom:28px}
body.rails.listening .toast{bottom:96px}
/* rails in compact landscape / full screen: overlay + slide away */
body.rails.ochrome{--rail:60px}
body.rails.ochrome .stage{left:0;right:0}
body.rails.ochrome .top,body.rails.ochrome .foot{height:auto;padding:calc(10px + env(safe-area-inset-top)) 0 calc(10px + env(safe-area-inset-bottom))}
body.rails.ochrome .top{background:linear-gradient(to left,rgba(8,16,36,.92),rgba(8,16,36,.55));padding-right:env(safe-area-inset-right);width:calc(var(--rail) + env(safe-area-inset-right))}
body.rails.ochrome .foot{background:linear-gradient(to right,rgba(8,16,36,.92),rgba(8,16,36,.55));padding-left:env(safe-area-inset-left);width:calc(var(--rail) + env(safe-area-inset-left))}
body.rails.ochrome.chrome-off .top{transform:translateX(100%)}
body.rails.ochrome.chrome-off .foot{transform:translateX(-100%)}
body.rails.ochrome .top .ib,body.rails.ochrome .ab,body.rails.ochrome .brand .hm{width:40px;height:40px;min-width:40px}
body.rails.ochrome .tools{gap:5px}
body.rails.ochrome .sep{margin:3px 0}
body.rails.ochrome .brand b{display:none}
body.rails.ochrome .navg input[type=range]{display:block;height:min(160px,26vh)}
body.rails.ochrome .player{bottom:10px}
@media (max-height:520px){
  body.rails #bLinks,body.rails .sep{display:none}
  body.rails .tools{gap:4px}
  body.rails .top .ib,body.rails .ab,body.rails .brand .hm{width:34px;height:34px;min-width:34px;border-radius:11px}
  body.rails .top .ib svg,body.rails .ab svg,body.rails .brand .hm svg{width:18px;height:18px}
  body.rails .brand{margin:0 0 4px}
  body.rails .tp{width:40px}
  body.rails .like{padding:6px 0 4px;font-size:11px}
  body.rails .acts{gap:6px}
  body.rails.ochrome{--rail:52px}
}


/* ---------- read-aloud player v2 ---------- */
.player{padding:10px 12px 10px 10px;gap:12px;border-radius:22px;min-width:min(620px,calc(100vw - 24px))}
.pcover{position:relative;width:44px;height:62px;flex:none;border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.pcover img{width:100%;height:100%;object-fit:cover;display:block}
.pcover .eq{position:absolute;inset:auto 0 0 0;height:22px;width:auto;margin:0;padding:0 8px 5px;gap:3px;background:linear-gradient(transparent,rgba(6,14,32,.85))}
.pinfo{flex:1;min-width:0;max-width:none;gap:2px}
.pinfo b{font-size:14px}
.pbar{height:3px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--blue);border-radius:3px;transition:width .4s ease}
.pctl{display:flex;align-items:center;gap:4px}
.popt2{display:flex;align-items:center;gap:6px}
.pchip{height:32px;padding:0 11px;border-radius:16px;display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);white-space:nowrap;max-width:150px;transition:background .2s}
.pchip:hover{background:rgba(255,255,255,.13)}
.pchip svg{width:15px;height:15px;flex:none}
.pchip span{overflow:hidden;text-overflow:ellipsis}
.pchip.studio{background:rgba(95,180,240,.16);border-color:rgba(95,180,240,.45);cursor:default}
.pchip.studio svg{color:var(--blue)}
.tts i.w{background:rgba(255,196,0,.55);box-shadow:0 0 0 2px rgba(255,196,0,.25)}
.tts i{transition:background .15s}
body.rails .player{bottom:18px}
@media (max-width:760px){
  .player{min-width:0;gap:8px;padding:8px}
  .pcover{display:none}
  .popt2 .pchip#pVoice{display:none}
  .pinfo b{font-size:12.5px}
}

/* ---------- touch devices ---------- */
@media (hover:none),(pointer:coarse){ .nav{display:none} }

/* ---------- compact landscape (phone on its side) ---------- */
body.ochrome{--bar:0px;--foot:0px}
body.ochrome .stage{top:0;bottom:0}
body.ochrome .top,body.ochrome .foot{height:52px;transition:transform .35s cubic-bezier(.3,.7,.2,1),opacity .35s}
body.ochrome .top{background:linear-gradient(rgba(8,16,36,.92),rgba(8,16,36,0))}
body.ochrome .foot{background:linear-gradient(rgba(8,16,36,0),rgba(8,16,36,.92))}
body.ochrome.chrome-off .top{transform:translateY(-100%);opacity:0}
body.ochrome.chrome-off .foot{transform:translateY(100%);opacity:0}
body.ochrome .player{bottom:60px}
body.ochrome.chrome-off .player{bottom:10px}
body.ochrome .hint{display:none}
body.ochrome .brand span{display:none}
body.ochrome .ab.lis span,body.ochrome .ab.cap span{display:none}
body.ochrome .navg input[type=range]{display:none}
body.ochrome .top .ib,body.ochrome .ab{height:36px;min-width:36px;width:auto}
body.ochrome .top .ib{width:36px}
body.ochrome .capbar{height:52px}

@media (max-width:1100px){ .tp .tt{max-width:130px} .navg input[type=range]{width:min(260px,26vw)} }
@media (max-width:760px){
  .navg input[type=range]{display:none}
  .foot{padding:0 10px}
  .acts{gap:6px}
  .tp{padding:0 2px 0 10px;height:38px}
  .tp .tt{max-width:92px;font-size:12px}
  .tp + .tp{display:none}
  .ab{height:38px;min-width:38px;padding:0 9px}
  .ab.cap span{display:none}
  .ab.lis span{display:none}
  #bLinks{display:none}
  .brand b{display:none}
  .brand .hm{width:36px;height:36px;border-radius:11px}
  .tools{gap:5px}
  .top .ib{width:36px;height:36px}
  .ab.lis{height:36px;min-width:36px;padding:0}
  .player{left:8px;right:8px;transform:translateY(20px);justify-content:space-between}
  .player.open{transform:none}
  .pinfo{min-width:0;flex:1}
  .count{min-width:0;font-size:12px}
  .capbar{font-size:12px;padding:0 64px 0 14px;text-align:center;line-height:1.5}
  .pop{left:10px!important;right:10px!important;width:auto;bottom:70px!important;top:auto!important}
}
@media (max-width:760px){
  :root{--bar:56px;--foot:58px}
  .top{padding:0 12px}.brand span{display:none}.brand b{font-size:19px}
  .ib{width:38px;height:38px;border-radius:11px}
  .nav{display:none}
  .foot{gap:12px}
  .thumbs{grid-template-columns:repeat(3,1fr)}
  .hint{top:auto;bottom:calc(var(--foot) - 2px);font-size:11px}
}
</style>
</head>

<div class="loader" id="loader"><div>أضواء</div></div>

<header class="top">

  </div>

  const st = $('#stage').getBoundingClientRect();
  const portrait = st.width < st.height * 1.02 || st.width < 560;
  const imm = document.body.classList.contains('immersive');
  const sidePad = portrait ? (imm ? 0 : 24) : (compact || TOUCH ? 24 : 150);
  const availW = st.width - sidePad, availH = st.height - (imm ? 0 : compact ? 12 : 30);
  let pw = portrait ? Math.min(availW, availH / RATIO) : Math.min(availW / 2, availH / RATIO);
  pw = Math.floor(pw); const ph = Math.floor(pw * RATIO);
  return {portrait, pw, ph, key: (portrait ? 'p' : 'l') + Math.round(pw / 6)};
}

function init(startNum){
  const L = layout();
  const wantMode = L.portrait ? 'p' : 'l';
  const book = $('#book');
  if (pf){ try{ pf.destroy(); }catch(e){} }
  // pf.destroy removes the node — recreate it
  let wrap = $('#bookWrap'); if (!$('#book')){ const b = document.createElement('div'); b.id='book'; wrap.appendChild(b); }
  const els = buildBook();
  const bw = L.portrait ? L.pw : L.pw*2;
  Object.assign($('#book').style,{width:bw+'px',height:L.ph+'px'});
  pf = new St.PageFlip($('#book'), {
    width: L.pw, height: L.ph, size: 'fixed',
    showCover: true, usePortrait: L.portrait, autoSize: false,
    minWidth: 100, maxWidth: 4000, minHeight: 100, maxHeight: 6000,
    maxShadowOpacity: .45, drawShadow: true, flippingTime: TOUCH ? 620 : 780,
    mobileScrollSupport: false, clickEventForward: true, useMouseEvents: true,
    swipeDistance: 24, showPageCorners: true, disableFlipByClick: false,
    startPage: toIdx(startNum || 1)
  });
  lastLayout = L.key;
  if (window.TTS) setTimeout(() => TTS.repaint(), 0);
  pf.loadFromHTML(els);
  mode = wantMode;
  pf.on('flip', onFlip);
  pfState = 'read';
  pf.on('changeState', e => {
    pfState = e.data;
    if (window.Sound) Sound.onState(e.data);
    if (e.data === 'flipping' || e.data === 'user_fold') preload(true);
    if (e.data === 'read' && queued){ const n = queued; queued = null; setTimeout(() => goTo(n), 30); }
  });

}

/* which original pages are on screen */
function visible(){
  const i = pf.getCurrentPageIndex();
  if (mode === 'p') return [toNum(i)];
  if (i === 0) return [toNum(0)];
  if (i >= N-1) return [toNum(N-1)];
  const s = i % 2 ? i : i-1;
  return [toNum(s+1), toNum(s)].sort((a,b)=>a-b);
}
function preload(wide){
  const v = visible(), r = wide ? 4 : 3;
  for (let n = Math.max(1, v[0]-r); n <= Math.min(N, v[v.length-1]+r); n++){
    const img = pageEls[toIdx(n)]?.querySelector('img');
    if (img && !img.src) img.src = img.dataset.src;
  }
}
function onFlip(){
  const v = visible();

  const first = v[0], last = v[v.length-1];
  $('#count').innerHTML = `<span dir="ltr">${v.length>1 ? `<b>${first}–${last}</b>` : `<b>${first}</b>`} / ${N}</span>`;
  const s = $('#slider'); s.value = first; s.style.setProperty('--p', ((first-1)/(N-1)*100)+'%');
  $('#bBack').disabled = first <= 1; $('#bFwd').disabled = last >= N;
  // centre the closed covers
  let tx = 0;
  if (mode === 'l'){ if (first === 1 && v.length===1) tx = 25; else if (last === N && v.length===1) tx = -25; }
  $('#bookWrap').style.transform = `translateX(${tx}%)`;
  document.querySelectorAll('.th.cur').forEach(t=>t.classList.remove('cur'));
  v.forEach(n => $('#th'+n)?.classList.add('cur'));
  try{ history.replaceState(null,'','#page-'+first); }catch(e){}
  if (window.renderTopics) renderTopics(v);
  if (window.TTS) TTS.onFlip(v);
  if (window.Stats){ Stats.open(first); Stats.view(v); }
}

/* navigation (reading direction = RTL, so "forward" is flipPrev on the reversed stack) */
const fwd = () => pf.flipPrev('top'), back = () => pf.flipNext('top');

function goTo(n){
  n = Math.max(1, Math.min(N, n|0));

  const cur = visible();

  const idx = toIdx(n);
  pageEls[idx].querySelector('img').src ||= IMG(n);

/* ---------- search ---------- */
// Normalise hamza/ta-marbuta/tashkeel variants on both sides so Arabic queries match loosely.
function norm(s){
  return s.replace(/[\u0640\u064B-\u065F\u0670\u200B-\u200F\uFFFD]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[^\p{L}\p{N}]/gu,'').toLowerCase();
}
const isAr = s => /[\u0600-\u06FF]/.test(s);
const clean = s => s.replace(/[\u0640\uFFFD]/g,'').replace(/([ً-ْ])\1+/g,'$1');
const IDX = DATA.pages.map(p => p.words.map(w => norm(w[0])));
function lines(p){
  const m = new Map();
  p.words.forEach((w,k)=>{ if(!m.has(w[5])) m.set(w[5],[]); m.get(w[5]).push(k); });
  return m;
}
const LINES = DATA.pages.map(lines);
const esc = s => s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

let lastHits = null;
function search(q){
  const toks = q.trim().split(/\s+/).map(norm).filter(t=>t.length>0);
  const box = $('#results');
  clearHL();
  if (!toks.length || (toks.length===1 && toks[0].length<2)){ $('#smeta').textContent=''; box.innerHTML='<div class="empty">ابحث عن أي كلمة في العدد، وستظهر لك الصفحات مع تظليل الكلمة داخلها.</div>'; lastHits=null; return; }
  const hits = []; let total = 0;
  DATA.pages.forEach((p,pi)=>{
    const ix = IDX[pi];
    if (!toks.every(t => ix.some(w => w.includes(t)))) return;
    const ks = []; ix.forEach((w,k)=>{ if (toks.some(t=>w.includes(t))) ks.push(k); });
    total += ks.length; hits.push({n:pi+1, ks});
  });
  lastHits = hits;
  $('#smeta').textContent = hits.length ? `${total} نتيجة في ${hits.length} صفحة` : '';
  if (!hits.length){ box.innerHTML = '<div class="empty">لا توجد نتائج. جرّب كلمة أقصر أو صيغة أخرى.</div>'; return; }
  box.innerHTML = '';
  for (const h of hits){
    const p = DATA.pages[h.n-1], set = new Set(h.ks), used = new Set(), snips = [];
    for (const k of h.ks){
      const key = p.words[k][5]; if (used.has(key)) continue; used.add(key);
      let ln = LINES[h.n-1].get(key).slice();
      snips.push(ln.map(j => set.has(j) ? `<mark>${esc(clean(p.words[j][0]))}</mark>` : esc(clean(p.words[j][0]))).join(' '));
      if (snips.length >= 2) break;
    }
    const b = document.createElement('button'); b.className='res';
    b.innerHTML = `<img loading="lazy" src="${TH(h.n)}" alt=""><div><div class="rp">صفحة ${h.n} · ${h.ks.length} ${h.ks.length>1?'مواضع':'موضع'}</div><div class="rs">${snips.join('<br>… ')}</div></div>`;
    b.onclick = () => { showHL(h); if (innerWidth < 900) closeDrawers(); goTo(h.n); };
    box.appendChild(b);
  }
}
function clearHL(){ document.querySelectorAll('.hl').forEach(h=>h.innerHTML=''); }
function showHL(h){
  clearHL();
  for (const hh of (lastHits||[])){
    const p = DATA.pages[hh.n-1], layer = pageEls[toIdx(hh.n)].querySelector('.hl');
    for (const k of hh.ks){ const w=p.words[k]; const i=document.createElement('i');
      Object.assign(i.style,{left:(w[1]*100-.3)+'%',top:(w[2]*100-.15)+'%',width:(w[3]*100+.6)+'%',height:(w[4]*100+.3)+'%'}); layer.appendChild(i); }
  }
}
let st, sst, lastQ = ''; $('#q').addEventListener('input', e => { clearTimeout(st); st = setTimeout(()=>search(e.target.value), 180);
  clearTimeout(sst); sst = setTimeout(() => { const v = e.target.value.trim(); if (v.length >= 2 && v !== lastQ && window.Stats){ lastQ = v; Stats.ev('search', {q: v, v: lastHits ? lastHits.length : 0}); } }, 1500); });

let zl = 1;

// Real full screen where the browser allows it (desktop, Android, iPad); on iPhone the same
// button gives an immersive view: bars hide, the magazine takes the whole screen.
const FS = {
  get el(){ return document.fullscreenElement || document.webkitFullscreenElement; },
  req(){ const d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen; if (!f) return Promise.resolve(false);
         try{ return Promise.resolve(f.call(d, {navigationUI: 'hide'})).then(() => true, () => false); }catch(e){ return Promise.resolve(false); } },
  exit(){ const f = document.exitFullscreen || document.webkitExitFullscreen; if (this.el && f) try{ Promise.resolve(f.call(document)).catch(() => {}); }catch(e){} }
};
const STANDALONE = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone;
let fsTipShown = false;
function setImmersive(on){
  const B = document.body; if (B.classList.contains('immersive') === on) return;
  B.classList.toggle('immersive', on);

  if (on){
    FS.req().then(ok => {

    });
  } else FS.exit();
  setCompact(); dispatchEvent(new Event('resize'));
}
$('#bFull').onclick = () => setImmersive(!document.body.classList.contains('immersive'));
['fullscreenchange','webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {

  else setImmersive(false);                 // left with Esc / system gesture
}));

/* =========================================================
   TOPICS — article ranges (PDF page numbers) from the TOC
   ========================================================= */
const ISSUE = CFG.label;
const TOPICS = CFG.topics;
const topicOf = n => TOPICS.find(t => n >= t.s && n <= t.e);
const topicsFor = v => { const o=[]; v.forEach(n=>{ const t=topicOf(n); if (t && !o.includes(t)) o.push(t); }); return o; };

/* =========================================================
   STATS — إحصائيات القراءة ← منصة إدارة الاتصال (Supabase)
   مجهولة بالكامل: رقم عشوائي للجهاز ورقم للجلسة، بدون اسم أو إيميل أو IP.
   ما تشتغل في المعاينة المحلية أو داخل Claude حتى ما تختلط الأرقام.
   ========================================================= */
const Stats = window.Stats = (() => {
  const SB = window.ADWAA_SUPABASE || {};
  const hasSB = !!(SB.url && SB.key) && /^https?:$/.test(location.protocol);
  const on = hasSB && !/claude|localhost|127\.0\.0\.1|^0\.0\.0\.0$|\.local$/i.test(location.hostname);
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
  const LS = (k, v) => { try{ if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } };
  let visitor = LS('adwaa-vid'); const ret = !!visitor;
  if (!/^[0-9a-f-]{36}$/i.test(visitor || '')){ visitor = uuid(); LS('adwaa-vid', visitor); }
  // نفس التبويب خلال 30 دقيقة = نفس الجلسة (إعادة التحميل ما تحسب زيارة جديدة)
  const SK = 'adwaa-sid-' + CFG.id; let sess = null;
  try{ const o = JSON.parse(sessionStorage.getItem(SK) || 'null'); if (o && Date.now() - o.at < 30*60e3) sess = o.id; }catch(e){}
  const fresh = !sess; if (!sess) sess = uuid();
  const touch = () => { try{ sessionStorage.setItem(SK, JSON.stringify({id: sess, at: Date.now()})); }catch(e){} };
  touch();
  const standalone = () => matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone;
  const device = (() => { const ua = navigator.userAgent;
    if (/iPad|Tablet/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) || (/Android/.test(ua) && !/Mobile/.test(ua))) return 'tablet';
    return /Mobi|iPhone|iPod|Android/i.test(ua) ? 'mobile' : 'desktop'; })();
  // من وين وصل القارئ: ?via=… (روابط المشاركة وQR) ثم الـreferrer
  const source = (() => {
    const ALIAS = {wa: 'whatsapp', tw: 'x', twitter: 'x', li: 'linkedin', ig: 'instagram', fb: 'facebook', mail: 'email', qrcode: 'qr', corpcom: 'platform', native: 'share', copy: 'link'};
    let u; try{ u = new URL(location.href); }catch(e){ return 'direct'; }
    let p = (u.searchParams.get('via') || u.searchParams.get('utm_source') || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 24);
    // نشيل الوسم من الرابط حتى ما ينتقل مع المشاركة التالية
    if (u.searchParams.has('via') || u.searchParams.has('utm_source')){ ['via','utm_source','utm_medium','utm_campaign'].forEach(k => u.searchParams.delete(k)); try{ history.replaceState(null, '', u.pathname + u.search + u.hash); }catch(e){} }
    if (p) return ALIAS[p] || p;
    if (standalone()) return 'app';
    let h = ''; try{ h = new URL(document.referrer).hostname.replace(/^www\./, ''); }catch(e){}
    if (!h || h === location.hostname) return 'direct';
    const R = [[/whatsapp|wa\.me/, 'whatsapp'], [/linkedin|lnkd\.in/, 'linkedin'], [/(^|\.)t\.co$|twitter|(^|\.)x\.com$/, 'x'], [/instagram/, 'instagram'],
      [/facebook|(^|\.)fb\.(com|me)$/, 'facebook'], [/(^|\.)t\.me$|telegram/, 'telegram'], [/corpcom-team/, 'platform'], [/lmra/, 'lmra'],
      [/teams\.|teams\.microsoft/, 'teams'], [/mail\.|outlook|office|live\.com/, 'email'], [/google\./, 'google'], [/bing\.|duckduckgo|yahoo|yandex/, 'search']];
    for (const [re, k] of R) if (re.test(h)) return k;
    return 'web';
  })();

  const q = []; let timer = null, metaSent = LS('adwaa-meta-' + CFG.id) === '1';
  function flush(){
    clearTimeout(timer); timer = null;
    if (!on || !q.length) return;
    while (q.length){
      const body = {p_issue: CFG.id, p_visitor: visitor, p_session: sess, p_events: q.splice(0, 80)};
      if (!metaSent){ body.p_meta = {number: CFG.number, label: CFG.label, pages: N, topics: TOPICS.map(({id, s, e, t}) => ({id, s, e, t}))}; metaSent = true; LS('adwaa-meta-' + CFG.id, '1'); }
      try{ fetch(SB.url + '/rest/v1/rpc/adwaa_track', {method: 'POST', keepalive: true, headers: {apikey: SB.key, 'Content-Type': 'application/json'}, body: JSON.stringify(body)}).catch(() => {}); }catch(e){}
    }
  }
  function push(e){ if (!on) return; q.push(e); touch(); if (!timer) timer = setTimeout(flush, 4000); if (q.length >= 40) flush(); }

  // وقت القراءة الفعلي: الصفحة ظاهرة وفيه تفاعل خلال آخر دقيقتين (أو القراءة الصوتية شغالة)
  let active = 0, lastAct = Date.now(), lastSentT = 0; const dwell = {}; let listenS = 0;
  const seen = new Set();
  ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); }, {passive: true, capture: true}));
  const listening = () => document.body.classList.contains('listening');
  function commit(){
    for (const k in dwell){ if (dwell[k] >= 1) push({t: 'topic', tp: k, v: dwell[k]}); delete dwell[k]; }
    if (listenS){ push({t: 'listen', v: listenS}); listenS = 0; }
    if (active > lastSentT){ push({t: 'time', v: active}); lastSentT = active; }
  }
  if (on) setInterval(() => {
    const lis = listening();
    if (lis) listenS++;
    if (document.visibilityState !== 'visible' && !lis) return;
    if (Date.now() - lastAct > 120e3 && !lis) return;
    active++;
    try{ topicsFor(visible()).forEach(t => { dwell[t.id] = (dwell[t.id] || 0) + 1; }); }catch(e){}
    if (active % 30 === 0) commit();
  }, 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden'){ commit(); flush(); } else lastAct = Date.now(); });

/* =========================================================
   LIKES — Firebase (if configured) with a local fallback
   ========================================================= */
const Likes = (() => {
  const LS = 'adwaa-likes-' + CFG.id; let local = {};
  try{ local = JSON.parse(localStorage.getItem(LS) || '{}'); }catch(e){}
  const saveL = () => { try{ localStorage.setItem(LS, JSON.stringify(local)); }catch(e){} };
  const cache = {}, pending = {}; let remote = null;
  const cfg = window.FIREBASE_CONFIG;
  const ready = Stats.hasSB ? (async () => {
    // Supabase: عدّاد واحد لكل مواضيع العدد، والإعجاب يمر عبر adwaa_like
    const rpc = (fn, body) => fetch(Stats.SB.url + '/rest/v1/rpc/' + fn, {method: 'POST', headers: {apikey: Stats.SB.key, 'Content-Type': 'application/json'}, body: JSON.stringify(body)})
      .then(r => r.ok ? r.json() : r.text().then(t => { throw new Error(t || r.status); }));
    let state = null;
    const load = () => state ||= rpc('adwaa_like_state', {p_issue: CFG.id, p_visitor: Stats.visitor})
      .then(rows => { const m = {}; (rows || []).forEach(r => { m[r.topic] = r; }); return m; })
      .catch(e => { state = null; throw e; });
    try{ await load(); }catch(e){ console.warn('[likes]', e); return; }
    remote = {
      async get(id){ const m = await load(); const r = m[id]; return {count: r ? +r.n : 0, liked: !!(r && r.mine)}; },
      async set(id, liked){ const n = await rpc('adwaa_like', {p_issue: CFG.id, p_topic: id, p_visitor: Stats.visitor, p_session: Stats.sess, p_liked: liked}); return typeof n === 'number' ? n : null; }
    };
  })() : (cfg && cfg.apiKey) ? new Promise(res => {
    const s = document.createElement('script'); s.src = 'likes.bundle.js'; s.async = true;
    s.onload = () => window.AdwaaLikes.connect(cfg, CFG.id).then(r => { remote = r; res(); }).catch(e => { console.warn('[likes]', e); res(); });
    s.onerror = () => res(); document.head.appendChild(s);
  }) : Promise.resolve();
  const emit = id => document.dispatchEvent(new CustomEvent('likes', {detail:id}));
  function get(id){
    if (cache[id]) return Promise.resolve(cache[id]);
    return pending[id] ||= (async () => {
      await ready;
      if (remote){ try{ cache[id] = await remote.get(id); local[id] = cache[id].liked; saveL(); } catch(e){ console.warn('[likes]', e); } }
      cache[id] ||= {count: local[id] ? 1 : 0, liked: !!local[id]};
      emit(id); return cache[id];
    })();
  }
  async function toggle(id){
    const c = cache[id] || await get(id);
    const liked = !c.liked; c.liked = liked; c.count = Math.max(0, c.count + (liked ? 1 : -1));
    local[id] = liked; saveL(); emit(id);                       // optimistic
    if (remote){
      try{ const n = await remote.set(id, liked); if (typeof n === 'number' && c.liked === liked){ c.count = n; emit(id); } }
      catch(e){ c.liked = !liked; c.count = Math.max(0, c.count + (liked ? -1 : 1)); local[id] = !liked; saveL(); emit(id); toast('تعذّر حفظ الإعجاب، حاول مرة أخرى'); }
    }
    return c;
  }
  return {get, toggle, peek: id => cache[id]};
})();

const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

async function makeCard(S){
  const parts = [];
  for (const r of rects){
    const ix = Math.max(S.x, r.x), iy = Math.max(S.y, r.y), ax = Math.min(S.x+S.w, r.x+r.w), ay = Math.min(S.y+S.h, r.y+r.h);
    if (ax-ix > 2 && ay-iy > 2) parts.push({r, ix, iy, iw:ax-ix, ih:ay-iy});
  }
  if (!parts.length) return;
  document.body.style.cursor = 'progress';
  try{
    const ux = Math.min(...parts.map(p=>p.ix)), uy = Math.min(...parts.map(p=>p.iy));
    const ux2 = Math.max(...parts.map(p=>p.ix+p.iw)), uy2 = Math.max(...parts.map(p=>p.iy+p.ih));
    const imgs = await Promise.all(parts.map(p => loadImg(HI(p.r.n))));
    const k = imgs[0].naturalWidth / parts[0].r.w;
    const crop = document.createElement('canvas'); crop.width = Math.round((ux2-ux)*k); crop.height = Math.round((uy2-uy)*k);
    const cx = crop.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, crop.width, crop.height);
    parts.forEach((p, i) => { const im = imgs[i], s = im.naturalWidth / p.r.w;
      cx.drawImage(im, (p.ix-p.r.x)*s, (p.iy-p.r.y)*s, p.iw*s, p.ih*s, (p.ix-ux)*k, (p.iy-uy)*k, p.iw*k, p.ih*k); });
    cardPages = parts.map(p => p.r.n).sort((a,b) => a-b);
    const canvas = await renderCard(crop, cardPages);
    cardBlob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    cardName = `adwaa-${CFG.number}-p${cardPages.join('-')}.png`;
    const img = $('#cardImg'); if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);

  } catch(err){ console.error(err); toast('تعذّر إنشاء الصورة'); }
  finally{ document.body.style.cursor = ''; }
}

async function renderCard(crop, pages){

const Sound = (() => {

  ['pointerdown','touchstart','keydown'].forEach(ev => addEventListener(ev, () => { if (on) ensure(); }, {passive:true, capture:true}));
  const src = (t0, dur) => { const s = ctx.createBufferSource(); s.buffer = noise; s.start(t0, Math.random()*.6, dur + .05); return s; };
  function turn(level = 1){
    if (!on) return; const c = ensure(); if (!c) return;
    const t = c.currentTime + .005, D = (.40 + Math.random()*.16) * (TOUCH ? .85 : 1), v = level * (.85 + Math.random()*.3);
    const out = c.createGain(); out.gain.value = 1.05 * v;
    if (c.createStereoPanner){ const pn = c.createStereoPanner(), s = Math.random() < .5 ? -1 : 1; pn.pan.setValueAtTime(-.3*s, t); pn.pan.linearRampToValueAtTime(.3*s, t + D); out.connect(pn).connect(c.destination); }
    else out.connect(c.destination);
    // 1) the swish of the sheet moving through air
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = .65;
    bp.frequency.setValueAtTime(650, t); bp.frequency.exponentialRampToValueAtTime(2300 + Math.random()*900, t + D*.55); bp.frequency.exponentialRampToValueAtTime(1000, t + D);
    const g1 = c.createGain(); g1.gain.setValueAtTime(.0001, t); g1.gain.exponentialRampToValueAtTime(.45, t + D*.3); g1.gain.exponentialRampToValueAtTime(.85, t + D*.62); g1.gain.exponentialRampToValueAtTime(.0001, t + D);
    src(t, D).connect(bp).connect(g1).connect(out);
    // 2) paper texture — tiny crackles
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
    const g2 = c.createGain(); g2.gain.setValueAtTime(0, t);
    const ks = Array.from({length: 22}, () => t + .02 + Math.random()*D*.8).sort((a,b) => a-b);
    ks.forEach(tk => { g2.gain.setValueAtTime(.12 + Math.random()*.45, tk); g2.gain.setTargetAtTime(0, tk + .002, .007); });
    src(t, D).connect(hp).connect(g2).connect(out);
    // 3) soft landing of the page
    const tl = t + D*.8, lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
    const g3 = c.createGain(); g3.gain.setValueAtTime(.0001, tl); g3.gain.exponentialRampToValueAtTime(1.1, tl + .012); g3.gain.exponentialRampToValueAtTime(.0001, tl + .11);
    src(tl, .13).connect(lp).connect(g3).connect(out);
  }
  function onState(s){
    if (s === 'user_fold'){ if (Date.now() - lastFold > 900){ lastFold = Date.now(); turn(.35); } }
    else if (s === 'flipping') turn(1);
  }
  function set(v){ on = v; try{ localStorage.setItem('adwaa-sound', v ? '1' : '0'); }catch(e){} paint(); if (v) ensure(); }
  function paint(){ const b = $('#bSound'); b.classList.toggle('off', !on); b.setAttribute('aria-pressed', on); b.title = on ? 'كتم صوت التقليب' : 'تشغيل صوت التقليب'; }
  $('#bSound').onclick = () => { set(!on); toast(on ? 'صوت التقليب يعمل' : 'تم كتم صوت التقليب'); };
  paint();
  return {onState, turn};
})();

/* =========================================================
   READ-ALOUD — device Arabic voice, paragraph tap, highlight
   ========================================================= */
const TTS = window.TTS = (() => {
  const synth = window.speechSynthesis;
  const NAR = CFG.narration;                                // studio narration rendered at build time
  const GAP = NAR ? {h: 380, p: 240, s: 60} : {h: 520, p: 340, s: 140};   // natural pauses (ms)
  let voice = null, voices = [], rate = 1, active = false, playing = false, pos = {n: 1, i: 0}, token = 0, ttsNav = false;
  let audio = null, raf = 0, wordIdx = -1;
  const pre = new Map();
  try{ rate = +localStorage.getItem('adwaa-rate') || 1; }catch(e){}
  const chunks = n => (DATA.pages[n-1] && DATA.pages[n-1].say || []).map(c => ({n, idx: c.i, off: c.o, text: c.t, kind: c.k, lang: c.l, audio: c.a}));

  /* ---- voices (device fallback) ---- */
  function listVoices(){
    if (!synth) return [];
    const score = v => (/BH/i.test(v.lang) ? 3 : 0) + (/SA/i.test(v.lang) ? 2 : 0) + (/natural|online|neural|premium|enhanced|siri/i.test(v.name) ? 8 : 0) + (/google/i.test(v.name) ? 4 : 0) + (v.localService ? 0 : 1);
    voices = synth.getVoices().filter(v => /^ar([-_]|$)/i.test(v.lang)).sort((a, b) => score(b) - score(a));
    let saved = null; try{ saved = localStorage.getItem('adwaa-voice'); }catch(e){}
    voice = voices.find(v => v.name === saved) || voices[0] || null;
    paintVoice(); return voices;
  }
  const shortName = v => v ? v.name.replace(/^(Microsoft|Google|Apple)\s*/i, '').replace(/\s*(Online|\(Natural\)|Natural|-.*|\(.*\))\s*/g, ' ').trim().split(' ')[0] || v.name : 'صوت الجهاز';
  function paintVoice(){
    const b = $('#pVoice'), n = $('#pVoiceName');
    if (NAR){ b.classList.add('studio'); n.textContent = (NAR.name || 'Laila') === 'Laila' ? 'ليلى · صوت احترافي' : (NAR.name === 'Ali' ? 'علي · صوت احترافي' : NAR.name + ' · صوت احترافي'); b.dataset.tip = 'تسجيل بصوت عربي طبيعي'; return; }
    n.textContent = shortName(voice); b.dataset.tip = voices.length > 1 ? 'تغيير الصوت' : 'صوت الجهاز';
  }
  if (synth && !NAR){ listVoices(); synth.addEventListener ? synth.addEventListener('voiceschanged', listVoices) : (synth.onvoiceschanged = listVoices); }
  $('#pVoice').onclick = () => {
    if (NAR || voices.length < 2) return;
    voice = voices[(voices.indexOf(voice) + 1) % voices.length];
    try{ localStorage.setItem('adwaa-voice', voice.name); }catch(e){}
    paintVoice(); toast('الصوت: ' + voice.name); if (playing) speak();
  };

  /* ---- UI ---- */
  const player = $('#player');
  function info(){
    const c = chunks(pos.n), t = topicOf(pos.n);
    $('#pTitle').textContent = t ? t.t : 'صفحة ' + pos.n;
    $('#pInfo').textContent = `صفحة ${pos.n}` + (c[pos.i] && c[pos.i].kind === 'h' ? ' · عنوان' : '');
    $('#pThumb').src = TH(t ? t.s : pos.n);
    // progress through the article (or the page when outside articles)
    const s0 = t ? t.s : pos.n, e0 = t ? t.e : pos.n; let tot = 0, done = 0;
    for (let n = s0; n <= e0; n++){ const k = chunks(n).length; if (n < pos.n) done += k; else if (n === pos.n) done += Math.min(pos.i, k); tot += k; }
    $('#pBar').style.width = (tot ? Math.round(done / tot * 100) : 0) + '%';
    player.classList.toggle('paused', !playing);
    $('#pRate').textContent = (rate === 1 ? '1' : String(rate)) + '×';
  }
  function clearHL(){ document.querySelectorAll('.tts').forEach(l => l.innerHTML = ''); }
  function paintHL(){
    clearHL(); wordIdx = -1; if (!active) return;
    const c = chunks(pos.n)[pos.i]; if (!c) return;
    const el = pageEls[toIdx(c.n)]; if (!el) return;
    let layer = el.querySelector('.tts'); if (!layer){ layer = document.createElement('div'); layer.className = 'tts'; el.appendChild(layer); }
    const W = DATA.pages[c.n-1].words;
    c.idx.forEach((i, k) => { const w = W[i], b = document.createElement('i'); b.dataset.k = k; Object.assign(b.style, {left: (w[1]*100 - .3) + '%', top: (w[2]*100 - .2) + '%', width: (w[3]*100 + .6) + '%', height: (w[4]*100 + .4) + '%'}); layer.appendChild(b); });
  }
  function markWord(k){
    if (k === wordIdx) return; wordIdx = k;
    const c = chunks(pos.n)[pos.i]; if (!c) return;
    const layer = pageEls[toIdx(c.n)]?.querySelector('.tts'); if (!layer) return;
    layer.querySelectorAll('i.w').forEach(x => x.classList.remove('w'));
    const b = layer.querySelector(`i[data-k="${k}"]`); if (b) b.classList.add('w');
  }
  const wordAtChar = (c, ch) => { let k = 0; while (k + 1 < c.off.length && c.off[k + 1] <= ch) k++; return k; };

  /* ---- navigation through the script ---- */
  function advance(step){
    let {n, i} = pos; i += step;
    while (n >= 1 && n <= N){
      const c = chunks(n);
      if (i >= 0 && i < c.length){ pos = {n, i}; return true; }
      if (i < 0){ n--; if (n >= 1) i = chunks(n).length - 1; } else { n++; i = 0; }
    }
    return false;
  }
  function ensureVisible(n, then){
    if (visible().includes(n)) return then();
    ttsNav = true; goTo(n);
    const wait = () => { if (pfState === 'read' && visible().includes(n)){ ttsNav = false; then(); } else setTimeout(wait, 120); };
    setTimeout(wait, 150);
  }
  function stopSound(){
    cancelAnimationFrame(raf);
    if (audio){ audio.onended = audio.onerror = null; audio.pause(); }
    if (synth) synth.cancel();
  }
  function next(my, kind){
    if (my !== token || !playing) return;
    setTimeout(() => {
      if (my !== token || !playing) return;
      if (advance(1)) speak(); else { playing = false; info(); clearHL(); toast('انتهت القراءة'); }
    }, (GAP[kind] || GAP.s) / Math.max(rate, .8));
  }
  function preload(){
    if (!NAR) return;
    let {n, i} = pos;
    for (let k = 0; k < 3; k++){ i++; let c = chunks(n); while (i >= c.length && n < N){ n++; i = 0; c = chunks(n); } const s = c[i]; if (!s || !s.audio || pre.has(s.audio)) continue; const a = new Audio(); a.preload = 'auto'; a.src = s.audio; pre.set(s.audio, a); if (pre.size > 6) pre.delete(pre.keys().next().value); }
  }
  function speak(){
    if (!active) return;
    const my = ++token; stopSound();
    if (!chunks(pos.n)[pos.i] && !advance(0)) return stop();
    ensureVisible(pos.n, () => {
      if (my !== token) return;
      const c = chunks(pos.n)[pos.i];
      paintHL(); info();
      if (!playing) return;
      if (NAR && c.audio){
        audio = pre.get(c.audio) || new Audio(c.audio); pre.delete(c.audio);
        audio.playbackRate = rate; audio.preservesPitch = true; audio.mozPreservesPitch = true; audio.webkitPreservesPitch = true;
        const len = c.text.length;
        const tick = () => { if (my !== token) return; const d = audio.duration; if (d && isFinite(d)){ const f = Math.min(1, Math.max(0, (audio.currentTime - .08) / Math.max(.2, d - .35))); markWord(wordAtChar(c, f * len)); } raf = requestAnimationFrame(tick); };
        audio.onended = () => { cancelAnimationFrame(raf); next(my, c.kind); };
        audio.onerror = () => { cancelAnimationFrame(raf); deviceSpeak(c, my); };      // fall back for this sentence
        audio.currentTime = 0;
        const pr = audio.play(); if (pr && pr.catch) pr.catch(() => { playing = false; info(); });
        raf = requestAnimationFrame(tick); preload();
      } else deviceSpeak(c, my);
    });
  }
  function deviceSpeak(c, my){
    if (!synth){ playing = false; info(); return; }
    const u = new SpeechSynthesisUtterance(c.text);
    if (c.lang === 'en'){ const en = synth.getVoices().find(v => /^en/i.test(v.lang)); if (en){ u.voice = en; u.lang = en.lang; } else u.lang = 'en-US'; }
    else if (voice){ u.voice = voice; u.lang = voice.lang; } else u.lang = 'ar-SA';
    u.rate = rate * (c.kind === 'h' ? .94 : 1); u.pitch = 1;
    u.onboundary = e => { if (my === token && e.name !== 'sentence') markWord(wordAtChar(c, e.charIndex)); };
    u.onend = () => next(my, c.kind);
    u.onerror = e => { if (my !== token) return; if (e.error !== 'interrupted' && e.error !== 'canceled'){ playing = false; info(); } };
    synth.speak(u);
  }
  function startAt(n, i = 0){ pos = {n, i}; if (!chunks(n).length) advance(0) || advance(1); playing = true; speak(); }
  function open(){
    if (!NAR && !synth){ toast('القراءة الصوتية غير مدعومة في هذا المتصفح'); return; }
    const go = () => {
      if (!NAR && !listVoices().length) toast('لا يوجد صوت عربي في جهازك، سيُستخدم الصوت الافتراضي');
      active = true; document.body.classList.add('listening'); $('#bListen').classList.add('on'); player.classList.add('open');
      applyClickMode(); paintVoice();
      const v = visible(); startAt(v[0]);
      toast('اضغط على أي فقرة لتبدأ القراءة منها');
    };
    if (!NAR && synth && !synth.getVoices().length){ let done = false; const f = () => { if (!done){ done = true; go(); } }; synth.addEventListener && synth.addEventListener('voiceschanged', f); setTimeout(f, 900); }
    else go();
  }
  function stop(){
    token++; active = false; playing = false; stopSound(); clearHL();
    document.body.classList.remove('listening'); $('#bListen').classList.remove('on'); player.classList.remove('open'); applyClickMode();
  }
  function applyClickMode(){ try{ pf.getSettings().disableFlipByClick = active; }catch(e){} }
  function pause(){
    playing = false; cancelAnimationFrame(raf);
    if (NAR && audio && !audio.paused){ audio.pause(); } else { token++; if (synth) synth.cancel(); }
    info();
  }
  function resume(){
    playing = true;
    if (NAR && audio && audio.paused && audio.currentTime > 0 && !audio.ended && chunks(pos.n)[pos.i]?.audio && audio.src.endsWith(chunks(pos.n)[pos.i].audio)){
      const my = token, c = chunks(pos.n)[pos.i], len = c.text.length;
      const tick = () => { if (my !== token) return; const d = audio.duration; if (d && isFinite(d)) markWord(wordAtChar(c, Math.min(1, Math.max(0, (audio.currentTime - .08) / Math.max(.2, d - .35))) * len)); raf = requestAnimationFrame(tick); };
      audio.play().catch(() => {}); raf = requestAnimationFrame(tick); info();
    } else speak();
  }
  // tap a paragraph to read from it
  let down = null;
  $('#stage').addEventListener('pointerdown', e => { down = active ? {x: e.clientX, y: e.clientY, t: Date.now()} : null; }, true);
  $('#stage').addEventListener('pointerup', e => {
    if (!down || !active) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10 || Date.now() - down.t > 600; down = null;
    if (moved || e.target.closest('a')) return;
    const r = pageRects().find(r => e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h); if (!r) return;
    const fx = (e.clientX - r.x) / r.w, fy = (e.clientY - r.y) / r.h, W = DATA.pages[r.n-1].words, cs = chunks(r.n);
    let best = -1, bd = 1e9;
    cs.forEach((c, ci) => c.idx.forEach(i => { const w = W[i]; const dx = Math.max(w[1] - fx, 0, fx - (w[1] + w[3])), dy = Math.max(w[2] - fy, 0, fy - (w[2] + w[4])); const d = dx*dx + dy*dy*4; if (d < bd){ bd = d; best = ci; } }));
    if (best >= 0 && bd < .0025){ pos = {n: r.n, i: best}; playing = true; speak(); }
  });
  $('#bListen').onclick = () => active ? stop() : open();
  $('#pClose').onclick = stop;
  $('#pPlay').onclick = () => playing ? pause() : resume();
  $('#pNext').onclick = () => { if (advance(1)){ playing = true; speak(); } };
  $('#pPrev').onclick = () => { if (advance(-1)){ playing = true; speak(); } };
  $('#pRate').onclick = () => {
    const R = [1, 1.15, 1.3, .9]; rate = R[(R.indexOf(rate) + 1) % R.length] || 1;
    try{ localStorage.setItem('adwaa-rate', rate); }catch(e){}
    info(); if (NAR && audio && !audio.paused) audio.playbackRate = rate; else if (playing) speak();
  };
  document.addEventListener('keydown', e => { if (!active || e.target.tagName === 'INPUT') return; if (e.key === 'k' || e.key === 'K'){ e.preventDefault(); playing ? pause() : resume(); } });
  // Media Session: lock-screen / headphone controls on phones
  if ('mediaSession' in navigator){
    try{
      navigator.mediaSession.setActionHandler('play', () => resume());
      navigator.mediaSession.setActionHandler('pause', () => pause());
      navigator.mediaSession.setActionHandler('nexttrack', () => { if (advance(1)) speak(); });
      navigator.mediaSession.setActionHandler('previoustrack', () => { if (advance(-1)) speak(); });
    }catch(e){}
  }
  addEventListener('pagehide', () => stopSound());
  return {
    onFlip(v){ if (!active || ttsNav) return; if (!v.includes(pos.n)){ pos = {n: v[0], i: 0}; if (!chunks(pos.n).length) advance(0) || advance(1); if (playing) speak(); else { paintHL(); info(); } } },
    repaint(){ applyClickMode(); paintHL(); },
    get active(){ return active; }
  };
})();

/* =========================================================
   COMPACT LANDSCAPE — chrome auto-hides, any touch wakes it
   ========================================================= */
let chromeT;
window.wakeChrome = wakeChrome;
function overlayOpen(){ return !!document.querySelector('.drawer.open, .pop.open, .capo.open, .cardm.open, .zoom.open'); }
function wakeChrome(){
  document.body.classList.remove('chrome-off'); clearTimeout(chromeT);
  chromeT = setTimeout(() => { if (document.body.classList.contains('ochrome') && !overlayOpen()) document.body.classList.add('chrome-off'); }, 3200);
}
['pointerdown','keydown'].forEach(ev => addEventListener(ev, () => { if (document.body.classList.contains('ochrome')) wakeChrome(); }, {passive:true, capture:true}));
addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && document.body.classList.contains('ochrome')) wakeChrome(); }, {passive:true});
if (document.body.classList.contains('ochrome')) wakeChrome();
if (TOUCH) $('#hint').textContent = 'اسحب الصفحة بإصبعك للتقليب، أو اضغط على طرفها';
$('#slider').max = N;


/* ---------- tooltips for toolbar buttons ---------- */
(() => {
  const tip = $('#tip'); let cur = null;
  document.querySelectorAll('.top [title], .foot [title]').forEach(el => { el.dataset.tip = el.title; el.removeAttribute('title'); });
  const show = el => {
    const txt = el.dataset.tip || el.querySelector('[data-tip]')?.dataset.tip; if (!txt) return;
    tip.textContent = txt; tip.classList.add('on'); cur = el;
    const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect(), B = document.body.classList;
    let x, y;
    if (B.contains('rails')){ y = r.top + r.height/2 - t.height/2; x = el.closest('.top') ? r.left - t.width - 12 : r.right + 12; }
    else { x = r.left + r.width/2 - t.width/2; y = el.closest('.top') ? r.bottom + 10 : r.top - t.height - 10; }
    tip.style.left = Math.max(8, Math.min(innerWidth - t.width - 8, x)) + 'px'; tip.style.top = Math.max(8, Math.min(innerHeight - t.height - 8, y)) + 'px';
  };
  const hide = () => { tip.classList.remove('on'); cur = null; };
  document.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest('.top [data-tip], .foot [data-tip], .like'); if (el && el !== cur){ if (el.classList.contains('like')) el.dataset.tip = el.closest('.tp')?.querySelector('.tt')?.textContent ? 'إعجاب · ' + el.closest('.tp').querySelector('.tt').textContent : 'إعجاب'; show(el); } else if (!el) hide(); });
  document.addEventListener('pointerdown', hide, true);
  addEventListener('blur', hide);
})();

/* ---------- boot ---------- */
function hashPage(){ const m = location.hash.match(/^#page-(\d+)$/); return m ? +m[1] : 1; }
addEventListener('hashchange', () => { const n=hashPage(); if (!visible().includes(n)) goTo(n); });
const start = hashPage();
init(start);
const first = pageEls[toIdx(start)].querySelector('img');
const done = () => { $('#loader').classList.add('done'); const h=$('#hint'); h.classList.add('on'); setTimeout(()=>h.classList.remove('on'),4200); };
if (first.complete && first.naturalWidth) done(); else { first.addEventListener('load', done); first.addEventListener('error', done); setTimeout(done, 4000); }
</script>
